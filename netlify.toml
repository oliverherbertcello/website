# The site is one page, built by source/gen/deploy.sh into public/. No build step.
[build]
  command = ""
  publish = "public"

# Long cache for assets that never change name
[[headers]]
  for = "/webfonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old test address
[[redirects]]
  from = "/prototype/*"
  to = "/"
  status = 301

# Old Wix pages: send each to the matching part of the new page
[[redirects]]
  from = "/about"
  to = "/#about"
  status = 301
[[redirects]]
  from = "/bio"
  to = "/#about"
  status = 301
[[redirects]]
