[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The design prototype is for review only.
[[headers]]
  for = "/prototype/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Until the real homepage is built, the preview opens on the prototype.
[[redirects]]
  from = "/"
  to = "/prototype/"
  status = 302
  force = true
